<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Exchange</title>
<style>
body{font-family:Arial, sans-serif; padding:16px}
.card{border:1px solid #ccc;padding:12px;border-radius:8px;width:320px}
button{margin:6px}
</style>
</head>
<body>
<h2>Крипто-обмін (WebSocket)</h2>
<div class="card">
<div>Поточний курс: <span id="price">-</span> USD</div>
<div>Ваш баланс USD: <span id="usd">-</span></div>
<div>Ваша криптовалюта: <span id="crypto">-</span></div>
<button id="buy">Buy 1</button>
<button id="sell">Sell 1</button>
</div>


<script>
const priceEl = document.getElementById('price');
const usdEl = document.getElementById('usd');
const cryptoEl = document.getElementById('crypto');
const buyBtn = document.getElementById('buy');
const sellBtn = document.getElementById('sell');


const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);


ws.onopen = ()=> console.log('ws open');
ws.onmessage = (ev)=>{
const data = JSON.parse(ev.data);
if (data.type === 'init'){
priceEl.textContent = data.price;
usdEl.textContent = data.state.usd.toFixed(2);
cryptoEl.textContent = data.state.crypto;
} else if (data.type === 'price'){
priceEl.textContent = data.price;
} else if (data.type === 'state'){
usdEl.textContent = data.state.usd.toFixed(2);
cryptoEl.textContent = data.state.crypto;
}
};


buyBtn.onclick = ()=> ws.send(JSON.stringify({ action:'buy' }));
sellBtn.onclick = ()=> ws.send(JSON.stringify({ action:'sell' }));
</script>
</body>
</html>
